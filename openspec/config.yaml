# openspec/config.yaml
# SDD project configuration for MiMesa. Generated by sdd-init on 2026-09-08.
# Session preflight decided by the user: execution_mode=auto, artifact_store=openspec,
# delivery_strategy=single-pr, review_budget=800 changed lines.
# Source of product truth: docs/requirements.md (Spanish, approved).
schema: spec-driven

context: |
  Product: MiMesa, a client-only web app to seat event guests at round tables via drag and drop and share a read-only guest view through a compressed URL fragment.
  Tech stack (planned, not yet scaffolded): Vite + React 19 + TypeScript, Tailwind CSS v4, Zustand with persist middleware (localStorage), @dnd-kit/core, React Router, lz-string, qrcode.react, html-to-image.
  Architecture: feature-sliced frontend (src/app, src/store, src/features/{event,guests,tables,share,guest-view,export}, src/lib); one Zustand store exposes the shared action contract in docs/requirements.md section 7.
  Routes: "/" editor and "/invitado#<state>" guest view; the state travels in the URL fragment and never reaches a server.
  Deploy: Vercel static site with vercel.json rewriting every route to index.html; no backend, database, auth, or CI.
  Testing: none by explicit decision (5-day academic demo); verification is a manual checklist keyed by requirement ID (RF-01..RF-35) plus a passing production build.
  Language: UI copy and docs/requirements.md in neutral professional Spanish; code, identifiers, comments, commits, and all SDD artifacts in English.
  Team: 3 people; shared base first (scaffold, store, types, routes, layout), then parallel tracks A (event + guests), B (canvas + drag and drop), C (share + guest view + export).

strict_tdd: false

testing:
  strict_tdd: false
  detected: "2026-09-08"
  workspace_test_command: ""
  projects:
    - path: "."
      stack: "Vite + React 19 + TypeScript (planned; package.json not yet created)"
      test_command: ""
      framework: ""
      layers:
        unit: false
        integration: false
        e2e: false
      coverage_command: ""
      linter: "eslint via the Vite React-TS template once scaffolded (npm run lint)"
      type_checker: "tsc --noEmit once scaffolded"
      formatter: ""
  notes:
    - "No test runner exists and none is planned: docs/requirements.md section 2.2 and section 8 exclude automated tests by explicit user decision."
    - "strict_tdd stays false. Downstream phases must not add a test runner, test files, TDD tasks, or CI."
    - "Zero project manifests were discovered at init time; the stack above comes from docs/requirements.md section 8."

rules:
  proposal:
    - Reference requirement IDs (RF-xx) from docs/requirements.md; do not add scope beyond section 2.1.
    - Respect the explicit exclusions in section 2.2 (no backend, no tests, no undo, no dark mode, no multiple events, no import from link).
    - Include a rollback plan when a change touches the persisted store shape or the share-link payload format.
  specs:
    - Use Given/When/Then for scenarios.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Name the covered RF-xx IDs in every requirement.
    - Spanish UI strings appear only as literal values; spec prose stays in English.
  design:
    - Treat the store action contract in docs/requirements.md section 7 as the shared team interface; any change to it must be explicit and justified.
    - Document seat geometry, drag-and-drop drop targets (seat vs table), rejection feedback, and share-link encoding with rationale.
    - Keep the guest-view payload minimal (v, n, d, p, t[] with n and s) as defined in section 7.
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session.
    - Order the shared base first (scaffold, store, types, routes, layout), then parallel tracks A, B, and C that do not edit the same files.
    - Within each track, schedule M-priority requirements before S-priority requirements.
    - Every task lists the RF-xx IDs it satisfies and its manual verification step.
    - Forecast against the 800-line review budget; delivery strategy is single-pr.
  apply:
    guidelines:
      - Follow the src/ layout in docs/requirements.md section 9.
      - Code, identifiers, and comments in English; UI copy in neutral professional Spanish.
      - Use conventional commits written in English.
      - Do not add test runners, test files, or CI configuration.
      - Do not change the store action contract without updating design.md first.
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "npm run build"
    typecheck_command: "npx tsc --noEmit"
    coverage_threshold: 0
    guidelines:
      - Verification is a manual checklist keyed by RF-xx ID plus a successful production build and type check.
      - Do not fail verification for the absence of automated tests; that absence is by design.
  archive:
    - Warn before merging destructive deltas.
