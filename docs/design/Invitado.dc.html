<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
  <style>
    :root{--bg:#f4f6fa;--panel:#ffffff;--ink:#1c2230;--ink-2:#4b5566;--ink-3:#7a8497;--line:#e3e7ee;--line-2:#cfd5df;--accent:#4f46e5;--accent-soft:#eef0ff}
    body{margin:0;font-family:Manrope,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
    a{color:var(--accent)} a:hover{color:#3730a3}
    *{box-sizing:border-box}
    .hit{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-weight:700}
    .hit span{font-size:13px;color:var(--ink-3);font-weight:600}
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #f4f6fa; display: flex; flex-direction: column; padding: 64px 20px 32px; gap: 28px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="1.75"><circle cx="12" cy="12" r="5.5"></circle><circle cx="12" cy="2.75" r="1.4" fill="#4f46e5" stroke="none"></circle><circle cx="21.25" cy="12" r="1.4" fill="#4f46e5" stroke="none"></circle><circle cx="12" cy="21.25" r="1.4" fill="#4f46e5" stroke="none"></circle><circle cx="2.75" cy="12" r="1.4" fill="#4f46e5" stroke="none"></circle><circle cx="18.5" cy="5.5" r="1.4" fill="#4f46e5" stroke="none"></circle><circle cx="18.5" cy="18.5" r="1.4" fill="#4f46e5" stroke="none"></circle><circle cx="5.5" cy="18.5" r="1.4" fill="#4f46e5" stroke="none"></circle><circle cx="5.5" cy="5.5" r="1.4" fill="#4f46e5" stroke="none"></circle></svg>
      <span style="font-weight: 800; font-size: 13px; letter-spacing: -0.01em; color: #4b5566">MiMesa</span>
    </div>
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.1; text-wrap: balance">Casamiento Ana y Juan</h1>
    <p style="margin: 0; color: #7a8497; font-weight: 600">20 de noviembre de 2026 · Salón Sur</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <label style="font-weight: 800; font-size: 14px">Buscá tu nombre</label>
    <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 2px solid #4f46e5; border-radius: 12px; background: #ffffff; font-weight: 600; font-size: 17px; box-shadow: 0 0 0 4px #eef0ff">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7a8497" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <span>luc<span style="display: inline-block; width: 2px; height: 20px; background: #4f46e5; vertical-align: -3px; margin-left: 1px"></span></span>
    </div>
    <p style="margin: 0; font-size: 13px; color: #7a8497; font-weight: 500">Podés escribir solo el nombre o el apellido, sin acentos.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div class="hit">Lucía Fernández<span>Amigas</span></div>
    <div class="hit">Lucas Peralta<span>Mesa 4</span></div>
    <div class="hit">Luciano Méndez<span>Mesa 6</span></div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border: 1px solid #e3e7ee; border-radius: 10px; background: #ffffff">
    <span style="font-weight: 800; font-size: 13px">¿No aparecés en la lista?</span>
    <p style="margin: 0; font-size: 13px; color: #7a8497; font-weight: 500; line-height: 1.5">Probá con tu apellido. Si sigue sin aparecer, consultá al organizador.</p>
  </div>
</div>
</x-dc>
</body>
</html>
